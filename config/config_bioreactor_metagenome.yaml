# config.yaml
# Select analyses
# Type true or false for the analysis you want. IMPORTANT - 
# "assemble" needs to be run first for all other sub analyses to work
sub_analyses:
  assemble: false
  assemble_megahit: true
  mags: false
  kaiju: true
  kaiju_only: false
  tpm: false
  tpm_high_diversity: false
  viruses: false
  bgc: false
  diversity: false
  metabolic: false
  s3_abundance: false
  mobilome: false
  qc_report: false
#Select threads used
max_threads: 10 # Max threads per rule

#Select samples used. This will be the name of your symlink file, the forward and reverse reads ending in  _1.fastq.gz and _2.fastq.gz respectively
samples:
 -  RW3_merged
 -  2_merged
 -  5_merged
 -  8_merged
 -  11_merged
 -  14_merged
 -  20_merged
# Add more sample names as needed

#Do not change
# Select paths to data and output directories
data_dir: "/mnt/seaes01-data01/nixon-microbiome/shared/bioinformatic_toolkit/symlink_staging" # NOTE - dont end the filepath with a "/"
output_dir: "/mnt/seaes01-data01/nixon-microbiome/shared/bioinformatic_toolkit/output_repository_bioreactor_metagenome"
containers_dir: "/mnt/seaes01-data01/nixon-microbiome/containers"
benchmark_dir: "/mnt/seaes01-data01/nixon-microbiome/shared/bioinformatic_toolkit/benchmarks/bioreactor_metagenome"
config_file: "/mnt/seaes01-data01/nixon-microbiome/shared/bioinformatic_toolkit/config_bioreactor_metagenome.yaml"
min_contig_len: 1000