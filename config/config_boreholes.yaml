# config.yaml
# Select analyses
# Type true or false for the analysis you want. IMPORTANT - 
# "assemble" needs to be run first for all other sub analyses to work
sub_analyses:
  assemble: false
  assemble_megahit: true
  mags: false
  mags_euk: true
  kaiju: true
  kaiju_only: false
  tpm: false
  tpm_high_diversity: false
  viruses: false
  bgc: false
  diversity: false
  metabolic: false
  s3_abundance: false
  mobilome: false
