# config.yaml

# Select analyses
# Type true or false for the analysis you want. IMPORTANT - "assemble" needs to be run first for all other sub analyses to work
sub_analyses:
  assemble:
  assemble_megahit: true
  assemble_megahit_only: false
  mags: true
  kaiju: false
  tpm: false
  tpm_high_diversity: false
  viruses: false
  bgc: false
  diversity: false
  metabolic: false
  s3_abundance: true
  mobilome: true
#Select threads used
max_threads: 10  # Max threads per rule

#Select samples used. This will be the name of your symlink file, the forward and reverse reads ending in  _1.fastq.gz and _2.fastq.gz respectively
samples:
 - GAP12014_DNA
 - GAP4LOW2014_DNA
 - TalikLake_DNA
 - KR6330m_DNA
 - KR1_DNA
 - Outo5500m_DNA
 - 215_S
 - 327A
 - 540
 - 844
 - D18
 - SnSt24_unmerged
 - SilStr24_unmerged
 - GF24loc1_unmerged
 - GF24loc2_unmerged
 - TBS24_unmerged
 - ERR11779543
# - ERR11779544
# - ERR11779545
# - ERR11779546
# - ERR11779547

# Add more sample names as needed

#Do not change
# Select paths to data and output directories
data_dir: "/mnt/seaes01-data01/nixon-microbiome/shared/Ayesha/" # NOTE - dont end the filepath with a "/"
output_dir: "/mnt/seaes01-data01/nixon-microbiome/shared/bioinformatic_toolkit/output_repository_ayesha"
containers_dir: "/mnt/seaes01-data01/nixon-microbiome/containers"

# Conda environments
conda_envs:
  bioconda: "/mnt/seaes01-data01/nixon-microbiome/shared/bioinformatic_toolkit/conda_envs/bioconda"
