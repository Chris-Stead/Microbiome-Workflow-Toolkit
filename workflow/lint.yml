name: Lint toolkit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        run: shellcheck --shell=bash bash_script scripts/*.sh

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.11.13
      - name: Run Ruff on Python scripts
        # Snakemake supplies the snakemake object to its scripts at runtime.
        run: ruff check --config 'builtins = ["snakemake"]' scripts/
